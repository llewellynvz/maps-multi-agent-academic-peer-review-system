services:
  mara:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: mara-platform:local
    ports:
      - "${MARA_PORT:-3100}:3100"
    volumes:
      # the container runs as the non-root node user (uid 1000); ensure ./data is writable by it
      - ./data:/app/data
    env_file:
      - ${MARA_ENV_FILE:-.env}
    environment:
      # In-container GROBID is reached over the compose network by service name, overriding any host
      # loopback value from .env. This is what makes the loopback port publish on grobid safe.
      GROBID_URL: http://grobid:8070
    extra_hosts:
      # lets the container reach a Langfuse running on the host (Linux compatibility)
      - "host.docker.internal:host-gateway"
    depends_on:
      # ordering only, never condition: service_healthy. A health gate would keep the whole
      # platform from booting while the GROBID JVM warms, and liveness is probed per review anyway.
      grobid:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  grobid:
    image: grobid/grobid:0.9.0-crf
    ports:
      # Loopback only: GROBID is unauthenticated and the whole manuscript stream flows through it, so it is
      # never exposed on the LAN. The mara container reaches it over the compose network by service name.
      - "127.0.0.1:8070:8070"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8070/api/isalive || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    restart: unless-stopped
